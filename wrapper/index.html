<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wrapper</title>
  </head>
  <body style="height:100vh;width:100vw;margin:0;padding:0">
    <iframe 
      id="wrapper"
      width="100%"
      height="100%"
      style="border:none"
      src="about:blank"
    ></iframe>

    <div id="controls" class="controls">
      
      <div id="notifications" class="notifications-container">
        
        <!-- <div id="1234" class="notification error show">
          The wallmonitor was not able to update on the most recent update
          <button class="close-button">
            <i class="fa-solid fa-x"></i>
          </button>
        </div> -->

      </div>

      <div class="controls-row">


        <button id="back" class="control">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button id="home" class="control">
          <i class="fa-regular fa-house"></i>
        </button>

        <div id="menu-select" class="custom-select-container dark-background">
          <button id="menu" class="control" aria-expanded="false" aria-controls="menu-options">
            <i class="fa-solid fa-bars"></i>
            <span id="menu-badge" class="badge"><!-- count filled in by main.ts --></span>
          </button>
          <div id="menu-options" class="options">
            <button id="refresh" class="option control">
              <i class="fa-solid fa-arrow-rotate-right"></i>
            </button>
            <button id="bell" class="option control">
              <i id="bell-full" class="fa-solid fa-bell"></i>
              <i id="bell-icon" class="fa-regular fa-bell no-display"></i>
              <span id="badge" class="badge"><!-- count filled in by main.ts --></span>
            </button>
          </div>
        </div>

      </div>
      
    </div>

    <script type="module" src="/src/main.ts"></script>

  </body>
  <style>
    .controls {
      /* Shared motion tokens: inherited by the menu and the notifications. */
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
      --duration: 0.45s;

      position:absolute;
      bottom:50px;
      right:50px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: end;
      gap: 10px;
    }

    .controls-row {
      display: flex;
      flex-direction: row;
      align-items: end;
      gap: 10px
    }

    .control {
      width: var(--control-size, 44px);
      height: var(--control-size, 44px);
      border-radius: 50%;
      border: none;
      background: linear-gradient(to bottom left, #1e90ff, #8a2be2);
      color: #fff;
      cursor: pointer;
    }

    /* Closed, this collapses to exactly the menu button's circle with a
       transparent fill, so the button is indistinguishable from the others.
       Opening grows the padding out from the button on every side at once. */
    .dark-background {
      /* background: linear-gradient(to bottom left, #002447, #23083b); */
      background: transparent;
      /* Large radius: a perfect circle when closed (44px box), a perfect
         pill once the padding and options expand it. */
      border-radius: 999px;
      padding: 0;
      margin: 0;
    }

    .custom-select-container {
      --control-size: 44px;
      --gap: 10px;
      --pad: 5px;
      --stagger: 60ms;

      display: inline-flex;
      flex-direction: column-reverse;
      /* No gap here: the options wrapper owns its own spacing so it can
         collapse to nothing without leaving a gap behind. */
      gap: 0;
      transition:
        padding var(--duration) var(--ease),
        margin var(--duration) var(--ease),
        background-color var(--duration) var(--ease);
    }

    .custom-select-container.open {
      background: #002447;
      padding: var(--pad);
      /* Negative margins cancel the padding on the three outer sides, so the
         button itself never moves while the pill grows around it. Padding and
         margin share one duration, so they stay cancelled mid-animation. */
      margin: 0 calc(-1 * var(--pad)) calc(-1 * var(--pad));
    }

    /* The wrapper is what makes the dark background grow/shrink: its height
       animates from 0 to the measured content height (set in main.ts). */
    .options {
      display: flex;
      flex-direction: column-reverse;
      gap: var(--gap);
      height: 0;
      margin-bottom: 0;
      overflow: hidden;
      pointer-events: none;
      transition:
        height var(--duration) var(--ease),
        margin-bottom var(--duration) var(--ease);
    }

    .custom-select-container.open .options {
      margin-bottom: var(--gap);
      pointer-events: auto;
    }

    /* Closed: each option sits one slot lower (i.e. on top of the menu
       button) and shrunk, so opening reads as growing out of the button.
       Closing runs the stagger in reverse: the farthest option leaves first. */
    .option {
      background: gray;
      flex: 0 0 auto;
      opacity: 0;
      transform: translateY(calc(var(--control-size) + var(--gap))) scale(0.4);
      transition:
        transform var(--duration) var(--ease),
        opacity calc(var(--duration) * 0.6) ease;
      transition-delay: calc((var(--n, 1) - 1 - var(--i, 0)) * var(--stagger));
    }

    .custom-select-container.open .option {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: calc(var(--i, 0) * var(--stagger));
    }

    #menu i {
      display: inline-block;
      transition: transform var(--duration) var(--ease);
    }

    .custom-select-container.open #menu i {
      transform: rotate(90deg);
    }

    @media (prefers-reduced-motion: reduce) {
      .custom-select-container,
      .options,
      .option,
      .badge,
      #menu i {
        transition-duration: 0.01ms;
        transition-delay: 0ms;
      }
    }

    .notifications-container {
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
    }

    .notification {
      width: 400px;
      border-radius: 22px;
      padding: 5px 5px 5px 22px;

      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;

      opacity: 0;
      /* Slides out towards the right edge it is anchored to. */
      transform: translateX(20px);
      pointer-events: none;
      transition:
        opacity calc(var(--duration) * 0.6) ease,
        transform var(--duration) var(--ease);
    }

    .notification.show {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .error {
      background-color: red
    }

    .warning {
      background-color: yellow
    }

    /* The badge lives inside the bell so it inherits the bell's transform and
       rides the expansion in lockstep. Anchor positioning could not do that:
       anchor() resolves against the anchor's *layout* box and ignores
       transforms, so the badge sat at the bell's final resting spot while the
       bell was still flying up from behind the menu button. */
    #bell,
    #menu {
      position: relative;
    }

    /* Inset to 0 rather than -5px: that keeps the badge inside the bell's 44px
       box, so the overflow clip on .options (what hides the flying buttons)
       never slices a corner off it. On a round button a corner-pinned badge
       still reads as sitting on the rim. */
    .badge {
      position: absolute;
      top: 0;
      right: 0;

      width: var(--badge-size, 22px);
      height: var(--badge-size, 22px);
      border-radius: 50%;
      background-color: yellow;
      color: #000;
      /* text-align alone left the digit stuck to the top of the circle. */
      display: grid;
      place-items: center;
      font: 600 12px/1 system-ui, sans-serif;

      opacity: 0;
      transform: scale(0);
      transition:
        transform var(--duration) cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity calc(var(--duration) * 0.4) ease;
      transition-delay: 0ms;
    }

    /* Both ends of both properties are now declared, which is what was missing
       before: nothing ever moved .badge off opacity 0, so no transition ran.
       --i is inherited from the parent .option's inline style, so the pop lands
       after whichever slot the bell occupies has arrived. Closing has no delay,
       so the badge leaves with the button rather than lingering. */
    .custom-select-container.open .option .badge.show {
      opacity: 1;
      transform: scale(1);
      transition-delay: calc(var(--i, 0) * var(--stagger) + var(--duration) * 0.6);
    }

    /* The two badges hand off: the menu button carries the count while
       collapsed, then drops it (base rule, no delay) the moment the menu opens
       and the bell takes over. Coming back, it waits out the collapse first. */
    .custom-select-container:not(.open) #menu-badge.show {
      opacity: 1;
      transform: scale(1);
      transition-delay: calc(var(--duration) * 0.6);
    }

    .close-button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      flex: 0;
    }

    .no-display {
      display: none
    }
  </style>
</html>
