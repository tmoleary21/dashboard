name: Build and attach dists to release

on:
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          zip -r "./dashboard-dist.zip" dist
          tar -czf "./dashboard-dist.tar.gz" dist

      - name: Upload dist to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dashboard-dist.zip" \
            "dashboard-dist.tar.gz" \
            --clobber

  build-wrapper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wrapper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Server
        run: |
          mkdir -p ./server/web
          mv ./dist/* ./server/web

      - name: Package
        run: |
          zip -r "./wrapper.zip" server
          tar -czf "./wrapper.tar.gz" server

      - name: Upload dist to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "wrapper.zip" \
            "wrapper.tar.gz" \
            --clobber

  attach-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package wallmonitor scripts
        run: |
          tag="${{ github.event.release.tag_name }}"
          sed -i "2s|.*|export VERSION=\"${tag}\"|" "wallmonitor/install.sh"
          zip -r "wallmonitor.zip" wallmonitor
          tar -czf "wallmonitor.tar.gz" wallmonitor


      - name: Upload wallmonitor scripts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" "wallmonitor.zip" "wallmonitor.tar.gz" --clobber
          gh release upload "$tag" "wallmonitor/install.sh" --clobber

